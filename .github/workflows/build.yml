name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Raspakiraj projekt (ako je ucitan kao zip)
        run: |
          if [ ! -f settings.gradle.kts ]; then
            ZIP=$(ls *.zip | head -n 1)
            echo "Raspakiravam $ZIP"
            unzip -q -o "$ZIP"
          fi
          ls -la

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build app
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Publish APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk reci-mama.apk
          gh release create "v${{ github.run_number }}" reci-mama.apk \
            --title "Reci mama (verzija ${{ github.run_number }})" \
            --notes "S mobitela preuzmi reci-mama.apk i instaliraj ga." \
            --target "${{ github.sha }}"
