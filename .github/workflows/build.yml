name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Raspakiraj projekt (ako je ucitan kao zip)
        run: |
          if [ ! -f settings.gradle.kts ]; then
            ZIP=$(ls *.zip | head -n 1)
            echo "Raspakiravam $ZIP"
            unzip -q -o "$ZIP"
          fi
          ls -la

      - name: Download the fast-mode speech model
        run: |
          curl -sSL --retry 3 -o model.zip https://alphacephei.com/vosk/models/vosk-model-small-en-us-0.15.zip
          unzip -q model.zip
          mkdir -p app/src/main/assets
          rm -rf app/src/main/assets/model-en-us
          mv vosk-model-small-en-us-0.15 app/src/main/assets/model-en-us
          # a new id makes the app unpack the model again after an update
          echo "${{ github.run_number }}" > app/src/main/assets/model-en-us/uuid
          find app/src/main/assets/model-en-us -maxdepth 2 | sort
          WORDS=$(find app/src/main/assets/model-en-us -name words.txt | head -n 1)
          echo "Vocabulary file: $WORDS"
          if [ -n "$WORDS" ]; then grep -m1 "^mama " "$WORDS" || { echo "::error::'mama' is not in the model vocabulary"; exit 1; }; fi

      - name: Test the fast-mode model on spoken Croatian
        run: |
          set -o pipefail
          sudo apt-get update -qq && sudo apt-get install -y -qq espeak-ng ffmpeg > /dev/null
          pip install -q vosk
          espeak-ng -v hr -s 150 -w test.wav "Mama, dođi ovamo. Tata je u kuhinji. Mama, gdje je lopta? Hvala, mama."
          python3 tools/test_model.py app/src/main/assets/model-en-us test.wav 2>&1 | tee model-test.txt
          pip install -q numpy
          python3 tools/eval_gain.py app/src/main/assets/model-en-us || true

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build app
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Publish APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk reci-mama.apk
          gh release create "v${{ github.run_number }}" reci-mama.apk \
            --title "Reci mama (verzija ${{ github.run_number }})" \
            --notes "S mobitela preuzmi reci-mama.apk i instaliraj ga." \
            --target "${{ github.sha }}"
